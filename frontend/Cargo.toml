[package]
name = "west-ops-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-net = { version = "0.6", features = ["http", "json"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator"] }
